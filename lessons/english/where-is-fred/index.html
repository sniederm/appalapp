<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Where is Fred?</title>
<link rel="stylesheet" href="../../../fonts/fonts.css">
<style>
:root{
  --bg:#E8EDF2; --surface:#FFFFFF; --ink:#1B2233; --muted:#5D6678;
  --red:#D7262B; --red-dk:#9E1A1E; --yellow:#F5C518; --navy:#22305A;
  --skin:#F2C9A0; --box:#CFA164; --box-top:#E2BC85; --box-side:#A87A3E; --box-in:#6E4A22;
  --ok:#1F9D55; --bad:#D7262B; --slot:#F3F5F8; --line:#C8D0DB; --ground:#D5DCE5;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121826; --surface:#1D2536; --ink:#EEF2F8; --muted:#A3ACBD;
    --slot:#273148; --line:#3A4560; --ground:#2B3550; --navy:#3B4F8C; --ok:#35C277;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121826; --surface:#1D2536; --ink:#EEF2F8; --muted:#A3ACBD;
  --slot:#273148; --line:#3A4560; --ground:#2B3550; --navy:#3B4F8C; --ok:#35C277;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  display:grid; grid-template-rows:auto 1fr auto;
  -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
  overflow:hidden;
}
header{
  display:flex; align-items:center; gap:14px;
  padding:10px 16px;
}
h1{
  font-family:"Lilita One","Arial Rounded MT Bold",system-ui,sans-serif;
  font-weight:400; font-size:clamp(1.3rem,2.6vw,1.8rem); margin:0; letter-spacing:.01em;
}
.dots{display:flex; gap:6px}
.dot{width:12px;height:12px;border-radius:50%;background:var(--line)}
.dot.on{background:var(--red)}
.dot.done{background:var(--ok)}
.spacer{flex:1}
.score{font-weight:800; color:var(--muted); font-variant-numeric:tabular-nums}
.iconbtn{
  border:0; background:var(--surface); color:var(--ink);
  width:44px; height:44px; border-radius:12px; font-size:20px; cursor:pointer;
  display:grid; place-items:center;
}
.iconbtn:focus-visible,.btn:focus-visible,.card:focus-visible,.slot:focus-visible{outline:3px solid var(--yellow); outline-offset:2px}

main{overflow-y:auto; padding:4px 16px 12px; -webkit-overflow-scrolling:touch}
.grid{
  display:grid; gap:12px;
  grid-template-columns:repeat(auto-fill,minmax(min(100%,255px),1fr));
  max-width:1300px; margin:0 auto;
}
.tile{
  background:var(--surface); border-radius:18px; padding:8px 8px 10px;
  border:3px solid transparent; transition:border-color .2s;
  display:flex; flex-direction:column; gap:6px;
}
.tile svg{width:100%; height:auto; display:block}
.tile.right{border-color:var(--ok)}
.tile.wrong{animation:flash .5s}
@keyframes flash{0%,100%{border-color:transparent}30%{border-color:var(--bad)}}
.sentence{
  display:flex; align-items:center; justify-content:center; flex-wrap:wrap;
  gap:5px; font-weight:800; font-size:.98rem; color:var(--muted);
}
.slot{
  min-width:92px; min-height:44px; padding:0 10px;
  border:2.5px dashed var(--line); border-radius:10px; background:var(--slot);
  display:inline-grid; place-items:center; color:var(--ink);
  transition:background .15s,border-color .15s;
}
.slot.hover{border-color:var(--yellow); background:color-mix(in srgb,var(--yellow) 22%,var(--slot))}
.slot.filled{border-style:solid; border-color:var(--ok); background:color-mix(in srgb,var(--ok) 14%,var(--surface)); color:var(--ok)}
.slot.pick{border-color:var(--yellow)}

footer{
  background:var(--surface);
  padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));
  margin-bottom:calc(-1 * env(safe-area-inset-bottom,0px));
  box-shadow:0 -1px 0 var(--line);
}
.pool{display:flex; flex-wrap:wrap; gap:10px; justify-content:center; max-width:1300px; margin:0 auto; min-height:52px}
.card{
  position:relative; touch-action:none; cursor:grab;
  font:800 1.12rem/1 "Nunito",system-ui,sans-serif; color:#fff;
  background:var(--red); border:0; border-radius:10px;
  padding:14px 18px 14px 24px; min-height:50px;
  box-shadow:0 3px 0 var(--red-dk);
}
.card::before{ /* reflective stripe */
  content:""; position:absolute; left:8px; top:9px; bottom:9px; width:5px; border-radius:3px; background:var(--yellow);
}
.card.dim{opacity:.25}
.card.sel{outline:3px solid var(--yellow); outline-offset:2px; transform:translateY(-3px)}
.card.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-5px)}}
.ghost{
  position:fixed; left:0; top:0; z-index:50; pointer-events:none; margin:0;
  transform-origin:center; box-shadow:0 10px 24px rgba(0,0,0,.28); cursor:grabbing;
}
.hint{color:var(--muted); font-weight:600; text-align:center; margin:0 0 8px; font-size:.95rem}

.overlay{
  position:fixed; inset:0; z-index:60; display:none; place-items:center;
  background:color-mix(in srgb,var(--bg) 70%,transparent); backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px);
  padding:20px;
}
.overlay.show{display:grid}
.panel{
  background:var(--surface); border-radius:24px; padding:28px 32px; text-align:center;
  max-width:420px; width:100%; border-top:10px solid var(--red);
}
.panel h2{font-family:"Lilita One",system-ui,sans-serif; font-weight:400; font-size:2.2rem; margin:0 0 6px}
.stars{font-size:3rem; letter-spacing:6px; margin:6px 0 4px}
.stars .off{filter:grayscale(1); opacity:.3}
.panel p{color:var(--muted); font-weight:600; margin:0 0 20px}
.btn{
  font:800 1.15rem "Nunito",system-ui,sans-serif; border:0; cursor:pointer;
  background:var(--red); color:#fff; border-radius:14px; padding:14px 26px; min-height:52px;
  box-shadow:0 3px 0 var(--red-dk); margin:4px;
}
.btn.alt{background:var(--slot); color:var(--ink); box-shadow:0 3px 0 var(--line)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header>
  <h1>Where is Fred?</h1>
  <div class="dots" id="dots"></div>
  <div class="spacer"></div>
  <div class="score" id="score"></div>
  <button class="iconbtn" id="fs" aria-label="Vollbild">⛶</button>
</header>

<main><div class="grid" id="grid"></div></main>

<footer>
  <p class="hint" id="hint">Zieh die Kärtchen zum passenden Bild.</p>
  <div class="pool" id="pool"></div>
</footer>

<div class="overlay" id="overlay">
  <div class="panel">
    <h2 id="ovTitle">Super!</h2>
    <div class="stars" id="stars"></div>
    <p id="ovText"></p>
    <div id="ovBtns"></div>
  </div>
</div>

<script>
/* ---------- drawing helpers (original artwork) ---------- */
function box(x,y,w,h,open){
  const d=12;
  let s='';
  if(!open){
    s+=`<polygon points="${x},${y} ${x+d},${y-8} ${x+w+d},${y-8} ${x+w},${y}" fill="var(--box-top)"/>`;
  }
  s+=`<polygon points="${x+w},${y} ${x+w+d},${y-8} ${x+w+d},${y+h-8} ${x+w},${y+h}" fill="var(--box-side)"/>`;
  s+=`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="var(--box)"/>`;
  s+=`<line x1="${x+w/2}" y1="${y}" x2="${x+w/2}" y2="${y+h*.35}" stroke="var(--box-side)" stroke-width="3"/>`;
  return s;
}
function boxInside(x,y,w){ // dark opening of an open box (draw before figure)
  const d=12;
  return `<polygon points="${x},${y} ${x+d},${y-8} ${x+w+d},${y-8} ${x+w},${y}" fill="var(--box-in)"/>`;
}
function flaps(x,y,w){
  return `<polygon points="${x},${y} ${x+12},${y-8} ${x-4},${y-22} ${x-16},${y-12}" fill="var(--box-top)"/>
          <polygon points="${x+w},${y} ${x+w+12},${y-8} ${x+w+28},${y-20} ${x+w+16},${y-10}" fill="var(--box-top)"/>`;
}
function shadow(cx,cy,rx){return `<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="5" fill="var(--ground)"/>`}

function fred(x,f,s=1,pose='stand',rot=0){
  let legs,arms;
  const N='var(--navy)';
  if(pose==='run'){
    legs=`<g transform="rotate(28 0 -16)"><rect x="-4" y="-16" width="7" height="16" rx="2" fill="${N}"/><rect x="-4" y="-4" width="11" height="4" rx="2" fill="#1a1a1a"/></g>
          <g transform="rotate(-30 0 -16)"><rect x="-4" y="-16" width="7" height="16" rx="2" fill="${N}"/><rect x="-4" y="-4" width="11" height="4" rx="2" fill="#1a1a1a"/></g>`;
    arms=`<g transform="rotate(-40 0 -34)"><rect x="-3" y="-36" width="6" height="18" rx="3" fill="${N}"/></g>
          <g transform="rotate(45 0 -34)"><rect x="-3" y="-36" width="6" height="18" rx="3" fill="${N}"/></g>`;
  }else if(pose==='sit'){
    legs=`<rect x="-6" y="-17" width="24" height="8" rx="3" fill="${N}"/><rect x="16" y="-21" width="5" height="12" rx="2" fill="#1a1a1a"/>
          <rect x="-6" y="-11" width="24" height="8" rx="3" fill="${N}" opacity=".85"/><rect x="16" y="-15" width="5" height="12" rx="2" fill="#1a1a1a"/>`;
    arms=`<rect x="-17" y="-36" width="6" height="18" rx="3" fill="${N}"/><g transform="rotate(-35 12 -34)"><rect x="10" y="-36" width="6" height="18" rx="3" fill="${N}"/></g>`;
  }else{
    legs=`<rect x="-9" y="-16" width="7" height="16" rx="2" fill="${N}"/><rect x="2" y="-16" width="7" height="16" rx="2" fill="${N}"/>
          <rect x="-10" y="-4" width="9" height="4" rx="2" fill="#1a1a1a"/><rect x="2" y="-4" width="9" height="4" rx="2" fill="#1a1a1a"/>`;
    arms= pose==='up'
      ? `<rect x="-19" y="-56" width="6" height="20" rx="3" fill="${N}"/><rect x="13" y="-56" width="6" height="20" rx="3" fill="${N}"/>`
      : `<rect x="-17" y="-36" width="6" height="18" rx="3" fill="${N}"/><rect x="11" y="-36" width="6" height="18" rx="3" fill="${N}"/>`;
  }
  const off = pose==='sit' ? 'translate(0,-0)' : '';
  return `<g transform="translate(${x},${f}) rotate(${rot}) scale(${s}) ${off}">
    ${legs}
    ${arms}
    <rect x="-12" y="-38" width="24" height="24" rx="6" fill="${N}"/>
    <rect x="-12" y="-25" width="24" height="3.5" fill="var(--yellow)"/>
    <rect x="-12" y="-19" width="24" height="2.5" fill="var(--yellow)" opacity=".8"/>
    <circle cx="0" cy="-48" r="10" fill="var(--skin)"/>
    <circle cx="-3.5" cy="-48" r="1.4" fill="#1B2233"/><circle cx="3.5" cy="-48" r="1.4" fill="#1B2233"/>
    <path d="M-3.5 -43.5 Q0 -40.5 3.5 -43.5" stroke="#1B2233" stroke-width="1.3" fill="none" stroke-linecap="round"/>
    <path d="M-11 -51 Q-11 -64 0 -64 Q11 -64 11 -51 Z" fill="var(--red)"/>
    <rect x="-15" y="-53" width="30" height="4" rx="2" fill="var(--red-dk)"/>
    <circle cx="0" cy="-58" r="2.6" fill="var(--yellow)"/>
  </g>`;
}
function arrowHead(x,y,ang){
  return `<g transform="translate(${x},${y}) rotate(${ang})"><polygon points="0,0 -10,-6 -10,6" fill="var(--red)"/></g>`;
}
function dirChip(right){
  const x= right?160:12;
  return `<g transform="translate(${x},6)"><rect width="28" height="20" rx="6" fill="var(--yellow)"/>
    <polygon points="${right?'8,6 20,10 8,14':'20,6 8,10 20,14'}" fill="#1B2233"/></g>`;
}
const DASH='stroke="var(--red)" stroke-width="2.5" stroke-dasharray="6 5" fill="none" stroke-linecap="round"';

const SCENES={
  'under': ()=>shadow(100,124,60)+
     `<rect x="60" y="74" width="6" height="48" fill="var(--box-side)"/><rect x="134" y="74" width="6" height="48" fill="var(--box-side)"/>
      <rect x="72" y="68" width="5" height="46" fill="var(--box-in)"/><rect x="146" y="68" width="5" height="46" fill="var(--box-in)"/>`+
     box(56,40,88,36)+fred(100,122,.68),
  'on': ()=>shadow(105,124,50)+box(70,82,60,40)+fred(104,80),
  'behind': ()=>shadow(105,124,55)+fred(128,98,.9)+box(58,70,80,52),
  'in': ()=>shadow(105,124,50)+boxInside(65,82,70)+fred(104,112,.9,'up')+box(65,82,70,40,true)+flaps(65,82,70),
  'in front of': ()=>shadow(100,104,50)+box(55,52,85,50)+shadow(100,130,22)+fred(98,130,1.02),
  'next to': ()=>shadow(90,124,65)+box(36,72,70,50)+fred(126,122,1,'sit'),
  'on the right side of': ()=>shadow(95,124,65)+box(40,72,70,50)+fred(142,122)+dirChip(true),
  'on the left side of': ()=>shadow(105,124,65)+box(90,72,70,50)+fred(62,122)+dirChip(false),
  'between': ()=>shadow(100,124,90)+box(12,82,55,40)+box(128,82,55,40)+fred(102,122),
  'over': ()=>shadow(100,124,45)+box(72,84,56,38)+`<path d="M30 118 Q100 -6 172 118" ${DASH}/>`+arrowHead(172,118,62)+fred(102,60,.75,'run',10),
  'into': ()=>shadow(100,124,50)+`<path d="M24 44 Q60 0 92 56" ${DASH}/>`+arrowHead(92,56,64)+boxInside(70,84,62)+fred(102,58,.85,'stand',180)+box(70,84,62,38,true)+flaps(70,84,62),
  'out of': ()=>shadow(100,124,50)+boxInside(70,88,62)+fred(102,64,.85,'up')+box(70,88,62,34,true)+flaps(70,88,62)+
     `<line x1="164" y1="80" x2="164" y2="28" ${DASH}/>`+arrowHead(164,24,-90),
  'around': ()=>`<ellipse cx="100" cy="104" rx="84" ry="24" ${DASH}/>`+shadow(100,112,34)+box(76,76,48,34)+arrowHead(100,128,180)+fred(168,116,.62,'run'),
  'away from': ()=>shadow(52,124,40)+box(22,72,55,50)+`<line x1="104" y1="133" x2="186" y2="133" ${DASH}/>`+arrowHead(190,133,0)+
     `<g stroke="var(--muted)" stroke-width="2.5" stroke-linecap="round"><line x1="100" y1="90" x2="116" y2="90"/><line x1="96" y1="102" x2="114" y2="102"/></g>`+fred(144,122,.95,'run'),
  'through': ()=>shadow(100,124,70)+`<line x1="10" y1="106" x2="46" y2="106" ${DASH}/>`+
     fred(152,122,.85,'run',12)+box(52,68,84,54)+
     `<polygon points="136,80 146,73 146,110 136,118" fill="var(--box-in)"/>
      <rect x="52" y="80" width="10" height="38" fill="var(--box-in)"/>`+
     `<line x1="170" y1="106" x2="186" y2="106" ${DASH}/>`+arrowHead(192,106,0)
};

/* ---------- game data ---------- */
const ROUNDS=[
  [['under','is'],['on','is'],['behind','is'],['in','is'],['in front of','is'],['next to','sits'],['on the right side of','is'],['on the left side of','is']],
  [['between','is','the boxes.'],['over','jumps'],['into','jumps'],['out of','jumps'],['around','runs'],['away from','runs'],['through','climbs']]
];

let round=0, mistakes=0, totalMistakes=0, placed=0, selected=null;
const $=id=>document.getElementById(id);
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};

function render(){
  const data=ROUNDS[round];
  mistakes=0; placed=0; selected=null;
  $('dots').innerHTML=ROUNDS.map((_,i)=>`<span class="dot ${i<round?'done':i===round?'on':''}"></span>`).join('');
  updateScore();
  // tiles in a shuffled order too, so the picture order is not the card order
  $('grid').innerHTML=shuffle(data).map(([word,verb,end])=>`
    <div class="tile" data-word="${word}">
      <svg viewBox="0 0 200 140" role="img" aria-label="Fred ${verb} ${word} ${end||'the box.'}">${SCENES[word]()}</svg>
      <div class="sentence">Fred ${verb} <span class="slot" tabindex="0" data-word="${word}"></span> ${end||'the box.'}</div>
    </div>`).join('');
  $('pool').innerHTML=shuffle(data).map(([w])=>`<button class="card" data-word="${w}">${w}</button>`).join('');
  $('hint').style.display= round===0 ? '' : 'none';
  bindCards();
  document.querySelectorAll('.slot').forEach(s=>s.addEventListener('click',()=>{ if(selected) tryPlace(selected,s); }));
}
function updateScore(){ $('score').textContent=`${placed} / ${ROUNDS[round].length}`; }

function tryPlace(card,slot){
  if(slot.classList.contains('filled')) return;
  const tile=slot.closest('.tile');
  if(card.dataset.word===slot.dataset.word){
    slot.textContent=card.dataset.word; slot.classList.add('filled'); tile.classList.add('right');
    card.remove(); selected=null; clearPick(); placed++; updateScore();
    if(placed===ROUNDS[round].length) setTimeout(finishRound,450);
  }else{
    mistakes++; totalMistakes++;
    tile.classList.remove('wrong'); void tile.offsetWidth; tile.classList.add('wrong');
    card.classList.remove('shake','sel'); void card.offsetWidth; card.classList.add('shake');
    selected=null; clearPick();
  }
}
function clearPick(){document.querySelectorAll('.card.sel').forEach(c=>c.classList.remove('sel'));document.querySelectorAll('.slot.pick').forEach(s=>s.classList.remove('pick'))}

/* ---------- pointer drag (works with touch, pen, mouse) ---------- */
function bindCards(){
  document.querySelectorAll('.card').forEach(card=>{
    card.addEventListener('pointerdown',e=>startDrag(e,card));
    card.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){e.preventDefault();toggleSelect(card);} });
  });
}
function toggleSelect(card){
  const was=card===selected; clearPick(); selected=null;
  if(!was){selected=card; card.classList.add('sel'); document.querySelectorAll('.slot:not(.filled)').forEach(s=>s.classList.add('pick'));}
}
function startDrag(e,card){
  if(e.button!==undefined && e.button!==0) return;
  e.preventDefault();
  const r=card.getBoundingClientRect();
  const sx=e.clientX, sy=e.clientY, ox=sx-r.left, oy=sy-r.top;
  let ghost=null, over=null, moved=false;
  card.setPointerCapture(e.pointerId);
  const move=ev=>{
    if(!moved && Math.hypot(ev.clientX-sx,ev.clientY-sy)<8) return;
    if(!moved){
      moved=true; clearPick(); selected=null;
      ghost=card.cloneNode(true); ghost.classList.remove('shake','sel'); ghost.classList.add('ghost');
      ghost.style.width=r.width+'px'; document.body.appendChild(ghost); card.classList.add('dim');
    }
    ghost.style.transform=`translate(${ev.clientX-ox}px,${ev.clientY-oy}px) rotate(-3deg) scale(1.06)`;
    const el=document.elementFromPoint(ev.clientX,ev.clientY);
    const slot=el && (el.closest('.slot') || (el.closest('.tile') && el.closest('.tile').querySelector('.slot')));
    const target= slot && !slot.classList.contains('filled') ? slot : null;
    if(target!==over){ over&&over.classList.remove('hover'); over=target; over&&over.classList.add('hover'); }
  };
  const up=()=>{
    card.removeEventListener('pointermove',move); card.removeEventListener('pointerup',up); card.removeEventListener('pointercancel',up);
    if(ghost) ghost.remove();
    card.classList.remove('dim');
    if(!moved){ toggleSelect(card); return; }
    if(over){ over.classList.remove('hover'); tryPlace(card,over); }
  };
  card.addEventListener('pointermove',move); card.addEventListener('pointerup',up); card.addEventListener('pointercancel',up);
}

/* ---------- end of round ---------- */
function starsFor(m){return m<=1?3:m<=3?2:1}
function finishRound(){
  const last=round===ROUNDS.length-1;
  const n=starsFor(mistakes);
  $('stars').innerHTML=[1,2,3].map(i=>`<span class="${i<=n?'':'off'}">⭐</span>`).join('');
  $('ovTitle').textContent= n===3?'Super!':n===2?'Well done!':'Geschafft!';
  $('ovText').textContent= mistakes===0?'Kein einziger Fehler!':`${mistakes} ${mistakes===1?'Fehlversuch':'Fehlversuche'}`;
  $('ovBtns').innerHTML= last
    ? `<button class="btn" id="b1">Nochmal von vorn</button>`
    : `<button class="btn" id="b1">Weiter zu Runde ${round+2}</button><button class="btn alt" id="b2">Runde wiederholen</button>`;
  $('overlay').classList.add('show');
  $('b1').onclick=()=>{ $('overlay').classList.remove('show'); round= last?0:round+1; if(last) totalMistakes=0; render(); };
  if($('b2')) $('b2').onclick=()=>{ $('overlay').classList.remove('show'); render(); };
  $('b1').focus();
}

/* ---------- fullscreen ---------- */
const docEl=document.documentElement;
const canFS=!!(docEl.requestFullscreen||docEl.webkitRequestFullscreen) && (document.fullscreenEnabled||document.webkitFullscreenEnabled);
if(!canFS) $('fs').style.display='none';
$('fs').addEventListener('click',()=>{
  const isFS=document.fullscreenElement||document.webkitFullscreenElement;
  try{
    if(isFS){ (document.exitFullscreen||document.webkitExitFullscreen).call(document); }
    else { const p=(docEl.requestFullscreen||docEl.webkitRequestFullscreen).call(docEl); if(p&&p.catch) p.catch(()=>{}); }
  }catch(_){}
});

render();
</script>
